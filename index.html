<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>Attendly — Face Attendance</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" data-view="dashboard" aria-label="Attendly home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>attendly<span class="brand-period">.</span></span>
        </a>

        <div class="workspace-label">WORKSPACE</div>
        <nav class="nav-list">
          <button class="nav-item active" type="button" data-view="dashboard">
            <span class="nav-icon" aria-hidden="true">▦</span>
            <span>Overview</span>
          </button>
          <button class="nav-item" type="button" data-view="attendance">
            <span class="nav-icon" aria-hidden="true">◷</span>
            <span>Attendance</span>
          </button>
          <button class="nav-item" type="button" data-view="people">
            <span class="nav-icon" aria-hidden="true">♙</span>
            <span>People</span>
          </button>
          <button class="nav-item" type="button" data-view="reports">
            <span class="nav-icon" aria-hidden="true">▥</span>
            <span>Reports</span>
          </button>
        </nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-icon" aria-hidden="true">✳</span>
            <strong>Need a hand?</strong>
            <p>Your attendance workspace, all in one place.</p>
            <a href="mailto:support@example.com">Contact support <span aria-hidden="true">↗</span></a>
          </div>
          <button class="profile-button" type="button" aria-label="Signed in as Olivia Rhye">
            <span class="avatar avatar-purple">OR</span>
            <span class="profile-copy"><strong>Olivia Rhye</strong><small>Workspace admin</small></span>
            <span class="profile-menu" aria-hidden="true">···</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span aria-hidden="true">/</span><strong id="breadcrumb-current">Overview</strong></div>
          <div class="topbar-actions">
            <span class="today-label"><span class="status-dot"></span> System operational</span>
            <button class="icon-button notification-button" type="button" aria-label="Notifications">
              <span aria-hidden="true">♧</span><i></i>
            </button>
            <span class="avatar avatar-purple top-avatar" aria-hidden="true">OR</span>
          </div>
        </header>
        <div id="app-content" class="content"></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
